# Tag a version (git tag v0.2.0 && git push --tags): builds the Windows installer (Protege-Setup.exe), the
# Mac app (Protege.dmg) and the portable zips, and attaches them to a GitHub release. The website's download
# buttons link straight to these files, so teachers never see GitHub.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the download carries this exact Node (an LTS), so the database library always matches it
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:logic
      - run: npm run licenses
      # the Windows installer is made by Inno Setup (free)
      - if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: protege-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.exe
            release/*.dmg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" downloads/* --repo "${GITHUB_REPOSITORY}" --title "Protégé ${GITHUB_REF_NAME#v}" --notes "Get it from https://protege-edu.pages.dev: Protege-Setup.exe for Windows, Protege.dmg for Mac. Installing over an older version keeps every class and student. The zips are the same thing without an installer, for school IT."
