# Tag a version (git tag v0.2.0 && git push --tags): builds the Windows and Mac downloads and
# attaches them to a GitHub release. Teachers press "Check for updates" to find it.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the download carries this exact Node (an LTS), so the database library always matches it
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:logic
      - run: npm run licenses
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: protege-${{ matrix.os }}
          path: release/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" downloads/*.zip --repo "${GITHUB_REPOSITORY}" --title "Protégé ${GITHUB_REF_NAME#v}" --notes "Download the zip for your computer, unzip it, and double-click Start Protégé. Your classes and students stay where they are."
