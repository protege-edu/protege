name: Something's broken
description: Tell us what went wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't include any student's name, nickname, or anything a student wrote.** Issues are public.
        Security or privacy problems go through the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Which side?
      options:
        - A student screen
        - A teacher page
        - Starting or installing Protégé
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Protégé version
      description: It's on the teacher page, under "Ready for class?"
      placeholder: "0.5.0"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "School Chromebook, Chrome 140"
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: A screenshot helps, but cover up any names first.
